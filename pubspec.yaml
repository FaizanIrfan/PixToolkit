name: pixtoolkit
description: "An image toolkit for compression, resizing, cropping, format conversion, and smart size reduction"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  image: ^4.9.1
  image_picker: ^1.2.3
  share_plus: ^12.0.2
  path_provider: ^2.1.6
  file_picker: ^3.0.4
  flutter_cache_manager: ^3.4.2
  flutter_riverpod: ^3.4.2
  provider: ^6.1.5+1
  uuid: ^4.6.0
  path: ^1.9.1
  intl: ^0.20.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets

  # permissions:
  #   - android.permission.READ_EXTERNAL_STORAGE
  #   - android.permission.WRITE_EXTERNAL_STORAGE
  #   - android.permission.CAMERA
